[project]
name = "synthiq-voice-caller"
version = "0.1.0"
description = "Synthiq Voice caller: plays a real person's recorded answers into any voice agent and grades the call from the agent's own tool results"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "websockets>=14.1",
    "httpx>=0.28.0",
    # Windows has no time zone database of its own; booking times are graded
    # in a named zone (see src/synthiq_caller/zones.py).
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

# The phone leg needs nothing beyond the core dependencies: it speaks Twilio's
# and Deepgram's protocols directly over websockets and httpx.
phone = []

[project.scripts]
synthiq-caller = "synthiq_caller.cli:main"
synthiq-caller-phone = "synthiq_caller.phone_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthiq_caller"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Test data reads better on one line than wrapped.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
files = ["src"]
