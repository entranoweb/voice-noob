# Production Docker Compose for Coolify Deployment
# All services on one server - Backend, Frontend, Postgres, Redis
# Coolify handles SSL/domains via Traefik automatically

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: synthiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # No default: a database on a password printed in this file is open to
      # anyone who can reach it. The backend also refuses to start on one.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a long random value}
      POSTGRES_DB: ${POSTGRES_DB:-voice_agent}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - synthiq-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: synthiq-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD to a long random value}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD to a long random value}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - synthiq-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synthiq-backend
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a long random value}@postgres:5432/${POSTGRES_DB:-voice_agent}
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD to a long random value}@redis:6379/0
      # The entrypoint waits for Redis with redis-cli, which needs the
      # password on its own; without it the wait never ends.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD to a long random value}
      # Security
      # Signs login tokens and the tokens that admit a carrier's media stream
      # to an agent. No default: the app refuses to start on a placeholder,
      # and failing here names the variable instead.
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY to a long random string, e.g. openssl rand -hex 32}
      # Encrypts the provider keys and integration credentials customers store.
      # "<id>:<base64 32-byte key>"; the first entry encrypts, every entry can
      # decrypt. No default: the app refuses to start without it. Keep a copy
      # off this server: losing it loses every stored credential.
      CREDENTIAL_ENCRYPTION_KEYS: ${CREDENTIAL_ENCRYPTION_KEYS:?set CREDENTIAL_ENCRYPTION_KEYS, see DEPLOYMENT.md}
      # Daily deletion of call data past each account's retention period.
      RETENTION_SWEEP_ENABLED: ${RETENTION_SWEEP_ENABLED:-true}
      RETENTION_SWEEP_INTERVAL_HOURS: ${RETENTION_SWEEP_INTERVAL_HOURS:-24}
      # CORS - Allow frontend domain
      CORS_ORIGINS: '["${FRONTEND_URL:-http://localhost:3000}"]'
      # The origin the embed snippet points customers' sites at: the widget
      # script and the embed page are served by the frontend.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # The first administrator, created on the first start against an empty
      # database. No defaults: a known address with a known password is a
      # working superuser login for anyone. The backend refuses to start on
      # a password this repository has ever shipped.
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL to the first administrator's address}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD to a long random value}
      # Whether strangers may create accounts. Closed unless set to true; the
      # administrator creates accounts at POST /api/v1/auth/users.
      ALLOW_PUBLIC_SIGNUP: ${ALLOW_PUBLIC_SIGNUP:-false}
      # /docs, /redoc and /openapi.json. Off unless set to true.
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      # Bearer token a scraper presents to read /metrics. Empty: /metrics
      # answers 404.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      # Telephony. Only what is listed here reaches the container, which is why
      # setting these in the deployment platform alone is not enough.
      #
      # PUBLIC_URL is the origin the carrier dials back: the answer document
      # builds the media stream URL from it. Unset, it falls back to the
      # request's own host, which behind a proxy is this container's address —
      # the call connects, the row lands, the caller hears silence.
      # See docs/HANDOFF.md 7.2.
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL to the backend's public origin, e.g. https://api.synthiqvoice.com}
      # Webhook signature verification. A webhook is checked against the key of
      # the workspace that owns the number or call it is about (set per
      # workspace in the app), then against the platform-wide key here. With
      # neither, the webhook is refused 403, whatever DEBUG says.
      #
      # Set these only when every number runs on one platform carrier account.
      # Where workspaces bring their own accounts, leave them empty: while one
      # is set, a webhook signed by that account is accepted for any workspace.
      TELNYX_PUBLIC_KEY: ${TELNYX_PUBLIC_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      # Accepts carrier webhooks with no verified signature. Leave false on
      # anything a real number points at.
      ALLOW_UNSIGNED_WEBHOOKS: ${ALLOW_UNSIGNED_WEBHOOKS:-false}
      # Outbound calls and buying numbers only; inbound never reads it.
      TELNYX_API_KEY: ${TELNYX_API_KEY:-}
      # Embeddable widget. An agent with no allowed sites can be embedded by no
      # other site unless the first of these is true; a session is cut off after
      # the second; tools run for embedded sessions only when the agent's owner
      # turns them on, unless the third is true.
      EMBED_ALLOW_ANY_ORIGIN_WHEN_UNSET: ${EMBED_ALLOW_ANY_ORIGIN_WHEN_UNSET:-false}
      EMBED_SESSION_MAX_SECONDS: ${EMBED_SESSION_MAX_SECONDS:-900}
      EMBED_TOOLS_DEFAULT_ENABLED: ${EMBED_TOOLS_DEFAULT_ENABLED:-false}
      # Where rate-limit counts are kept. Empty: the Redis above, shared by
      # every worker. "memory://" counts per process.
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-}
      DEBUG: ${DEBUG:-false}
      # Optional. A trace carries transcripts, so cleartext to a non-loopback
      # host is refused.
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-synthiq-voice-api}
      # Postgres connection for entrypoint health check
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
    # Reached through the reverse proxy on the compose network, which is
    # where TLS ends. Not published on the host: a published port answers
    # over plain HTTP beside the proxy, to anyone who can reach the server.
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - synthiq-network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${BACKEND_URL:-http://backend:8000}
        NEXT_PUBLIC_WS_URL: ${BACKEND_WS_URL:-ws://backend:8000}
    container_name: synthiq-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${BACKEND_URL:-http://backend:8000}
      NEXT_PUBLIC_WS_URL: ${BACKEND_WS_URL:-ws://backend:8000}
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - synthiq-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  synthiq-network:
    driver: bridge
